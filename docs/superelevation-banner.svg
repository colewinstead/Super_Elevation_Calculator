<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Superelevation Calculator</title>
  <desc id="desc">A stylized roadway curve with banking and engineering station marks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2b"/>
      <stop offset="0.55" stop-color="#0b3553"/>
      <stop offset="1" stop-color="#126782"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#263848"/>
      <stop offset="1" stop-color="#172633"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g opacity=".13" stroke="#8ee3ef" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360"/>
  </g>
  <g transform="translate(700 35) rotate(-7 230 145)">
    <path d="M10 275 C125 215 115 105 245 60 C330 30 395 55 475 15" fill="none" stroke="#10202c" stroke-width="104" stroke-linecap="round"/>
    <path d="M10 275 C125 215 115 105 245 60 C330 30 395 55 475 15" fill="none" stroke="url(#road)" stroke-width="84" stroke-linecap="round"/>
    <path d="M10 275 C125 215 115 105 245 60 C330 30 395 55 475 15" fill="none" stroke="#f7d154" stroke-width="3" stroke-dasharray="18 16"/>
    <path d="M-2 237L55 306M89 164l68 33M203 63l30 78M332 26l12 80" stroke="#7ee3ef" stroke-width="2" opacity=".75"/>
    <circle cx="89" cy="180" r="6" fill="#7ee3ef" filter="url(#glow)"/>
    <circle cx="218" cy="100" r="6" fill="#7ee3ef" filter="url(#glow)"/>
    <circle cx="338" cy="67" r="6" fill="#7ee3ef" filter="url(#glow)"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#fff">
    <text x="74" y="118" font-size="21" font-weight="600" letter-spacing="4" fill="#7ee3ef">ROADWAY DESIGN TOOLKIT</text>
    <text x="70" y="181" font-size="54" font-weight="750">Superelevation</text>
    <text x="70" y="239" font-size="54" font-weight="750">Calculator</text>
    <text x="74" y="290" font-size="19" fill="#c7e5ee">LandXML  •  ORD CSV  •  PDF  •  DXF</text>
  </g>
  <rect x="24" y="24" width="1152" height="312" rx="18" fill="none" stroke="#80dce8" stroke-opacity=".3"/>
</svg>
