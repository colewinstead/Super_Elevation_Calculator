name: Browser App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run shared-engine and browser-service tests
        run: python -m unittest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Type-check browser app
        working-directory: web
        run: npm exec tsc -- --noEmit

      - name: Lint browser app
        working-directory: web
        run: npm run lint

      - name: Build and test static browser app
        working-directory: web
        run: npm test

      - name: Upload deployable browser build
        uses: actions/upload-artifact@v4
        with:
          name: superelevation-browser-app
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build GitHub Pages app
        working-directory: web
        env:
          PAGES_BASE_PATH: /Super_Elevation_Calculator/
        run: npm run build:pages

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
