name: Browser App

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Run shared-engine and browser-service tests
        run: python -m unittest -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Type-check browser app
        working-directory: web
        run: npm exec tsc -- --noEmit

      - name: Lint browser app
        working-directory: web
        run: npm run lint

      - name: Build and test static browser app
        working-directory: web
        run: npm test

      - name: Upload deployable browser build
        uses: actions/upload-artifact@v7
        with:
          name: superelevation-browser-app
          path: web/dist
          if-no-files-found: error
          retention-days: 14
